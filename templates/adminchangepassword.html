{% include 'adminheader.html' %}

<style>
    /* Main Layout Alignment */
    .admin-main {
        margin-left: var(--sidebar-width);
        padding: 100px 2rem 2rem 2rem;
        transition: var(--transition);
        min-height: 100vh;
        background-color: var(--bg-deep);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .admin-main.sidebar-collapsed {
        margin-left: var(--sidebar-collapsed-width);
    }

    /* Security Card Styling (The Previous Style you liked) */
    .password-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 28px;
        padding: 3rem;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        text-align: center;
    }

    .security-icon {
        width: 70px;
        height: 70px;
        background: var(--accent-gradient);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: white;
        margin: 0 auto 1.5rem auto;
        box-shadow: 0 10px 20px rgba(0, 191, 165, 0.3);
    }

    .password-card h2 {
        color: var(--text-main);
        font-family: 'Raleway', sans-serif;
        font-weight: 700;
        margin-bottom: 0.5rem;
    }

    /* Form Elements with Toggle Option */
    .form-group {
        text-align: left;
        margin-bottom: 1.2rem;
        position: relative; /* Needed for positioning the eye icon */
    }

    .form-group label {
        display: block;
        color: var(--text-muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 8px;
        padding-left: 5px;
    }

    .form-input {
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 14px 45px 14px 15px; /* Right padding for the eye */
        color: white;
        font-size: 1rem;
        transition: var(--transition);
        text-align: center;
    }

    .form-input:focus {
        outline: none;
        border-color: var(--accent-teal);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 15px rgba(0, 191, 165, 0.2);
    }

    /* Eye Icon Styling */
    .toggle-eye {
        position: absolute;
        right: 15px;
        bottom: 14px;
        color: var(--text-muted);
        cursor: pointer;
        transition: 0.3s;
        font-size: 1.1rem;
    }
    .toggle-eye:hover { color: var(--accent-teal); }

    .btn-update {
        width: 100%;
        background: var(--accent-gradient);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 1.5rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Message Alerts */
    .msg-container { width: 100%; max-width: 450px; margin-bottom: 1rem; }
    .alert {
        padding: 12px; border-radius: 10px; font-weight: 500; text-align: center;
        margin-bottom: 10px;
    }
    .alert-error { background: rgba(255, 82, 82, 0.1); color: #ff5252; border: 1px solid rgba(255, 82, 82, 0.2); }
    .alert-success { background: rgba(0, 191, 165, 0.1); color: var(--accent-teal); border: 1px solid rgba(0, 191, 165, 0.2); }
</style>

<main class="admin-main" id="adminMain">

    <div class="msg-container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
                    <i class="fas {% if message.tags == 'error' %}fa-exclamation-circle{% else %}fa-check-circle{% endif %}"></i>
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <div class="password-card">
        <div class="security-icon">
            <i class="fas fa-user-shield"></i>
        </div>

        <h2>Security Settings</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Update your administrator credentials</p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Current Password</label>
                <input type="password" name="old_password" id="old_p" class="form-input" placeholder="••••••••" required>
                <i class="fas fa-eye toggle-eye" onclick="togglePass('old_p', this)"></i>
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password" id="new_p" class="form-input" placeholder="••••••••" required>
                <i class="fas fa-eye toggle-eye" onclick="togglePass('new_p', this)"></i>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" id="conf_p" class="form-input" placeholder="••••••••" required>
                <i class="fas fa-eye toggle-eye" onclick="togglePass('conf_p', this)"></i>
            </div>

            <button type="submit" class="btn-update">Update Password</button>
        </form>
    </div>
</main>

<script>
    function togglePass(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = "password";
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }
</script>
